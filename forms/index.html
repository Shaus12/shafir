<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b5aa6">
<title>טופס לחתימה · שפיר שיקום נזקים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;600;700&display=swap">
<style>
:root{
  --f-body:"IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --ink:#1c2220;--muted:#5b6562;--line:#d5dbd8;--surface:#fff;--bg:#f4f6f5;
  --brand:#0b5aa6;--brand-ink:#fff;--danger:#b42318;--ok:#1f7a3f;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--f-body);color:var(--ink);background:var(--bg);line-height:1.5;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
.brand{display:flex;justify-content:center;padding:8px 0 4px}
.brand img{width:170px;height:auto}
h1{font-size:1.35rem;text-align:center;margin:8px 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-block:12px}
.card h2{font-size:1rem;margin:0 0 10px}
label{display:block;font-weight:600;font-size:.95rem;margin:12px 0 4px}
label .req{color:var(--danger)}
input,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:88px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
.invalid input,.invalid textarea,.invalid .pad,.invalid .option{border-color:var(--danger)}
.field-label{font-weight:600;font-size:.95rem;margin:12px 0 4px}
.field-label .req{color:var(--danger)}
.ltr{direction:ltr;text-align:right}
.choice{display:grid;gap:8px}
.option{display:flex;align-items:center;gap:10px;margin:0;font-weight:400;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.option input{width:auto;margin:0;accent-color:var(--brand)}
input[type=file]{padding:10px}
.preview{display:block;max-width:100%;max-height:200px;margin-top:8px;border:1px solid var(--line);border-radius:10px}
.legal p.heading{font-weight:700;margin-top:14px}
.err{color:var(--danger);font-size:.85rem;min-height:1.1em;margin-top:4px}
.legal p{margin:0 0 8px;white-space:pre-wrap}
.legal .blank{color:var(--muted)}
.pad-wrap{position:relative}
.pad{display:block;width:100%;height:190px;border:1.5px dashed var(--muted);border-radius:12px;background:#fff;touch-action:none;cursor:crosshair}
.pad-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);pointer-events:none;font-size:.95rem}
.pad-hint[hidden]{display:none}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:8px}
.btn{display:block;width:100%;font:inherit;font-weight:700;font-size:1.05rem;padding:14px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.link{font:inherit;background:none;border:0;color:var(--brand);font-weight:600;padding:6px 4px;cursor:pointer}
.status{text-align:center;color:var(--muted);padding:32px 8px}
.status.error{color:var(--danger)}
.done{text-align:center;padding:24px 8px}
.done .mark{font-size:2.6rem;line-height:1;color:var(--ok)}
.done p{font-size:1.15rem;font-weight:700;margin:12px 0 20px}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:608px;margin:0 auto;background:#1c2220;color:#fff;padding:12px 14px;border-radius:10px;text-align:center}
.toast.err{background:var(--danger)}
</style>
</head>
<body>
<main>
  <div class="brand"><img src="/shafir-logo.png" alt="שפיר שיקום נזקים"></div>
  <div id="content"><p class="status">טוען את הטופס…</p></div>
</main>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="/forms/form.mjs"></script>
</body>
</html>
