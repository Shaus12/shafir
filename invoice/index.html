<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>אישור חשבונית מס · שפיר שיקום נזקים</title>
<style>
:root{--ink:#1c2220;--muted:#5b6562;--line:#d5dbd8;--surface:#fff;--bg:#f4f6f5;--brand:#0b5aa6;--danger:#b42318;--ok:#1f7a3f;--warn:#8a5a00}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:1.35rem;text-align:center;margin:12px 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-block:12px}
.card h2{font-size:1rem;margin:0 0 10px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
dt{color:var(--muted)}dd{margin:0;font-weight:600;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
td.n,th.n{text-align:end;white-space:nowrap}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-top:12px}
.totals .sum{font-weight:700;font-size:1.1rem}
label{display:block;font-weight:600;margin-bottom:6px}
input{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px}
button{width:100%;margin-top:12px;font:inherit;font-weight:700;font-size:1.05rem;padding:14px;border:0;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.msg{margin-top:10px;font-weight:600}.err{color:var(--danger)}.ok{color:var(--ok)}
.banner{border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:10px;font-weight:700;text-align:center}
pre{direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.8rem;background:#f0f2f1;padding:10px;border-radius:10px}
.big{font-size:1.4rem;font-weight:700;text-align:center}
</style>
</head>
<body>
<main>
  <h1>אישור חשבונית מס</h1>
  <p id="error" class="msg err" hidden></p>
  <div id="view" hidden>
    <div id="banner" class="banner" hidden>מצב בדיקה – לא תופק חשבונית אמיתית</div>
    <section id="companies" class="card" hidden><h2>החברות בחשבון AccountBook</h2><p>העתיקו את המספר המתאים ל-ACCOUNTBOOK_ESEK_NUM</p><dl id="companylist"></dl><p id="companyerr" class="msg err" hidden></p></section>
    <section class="card"><h2>פרטי הלקוח</h2><dl id="customer"></dl></section>
    <section class="card"><h2>שורות</h2>
      <table><thead><tr><th>תיאור</th><th class="n">כמות</th><th class="n">מחיר</th><th class="n">סה"כ</th></tr></thead><tbody id="lines"></tbody></table>
      <div class="totals" id="totals"></div>
    </section>
    <form id="form" class="card" autocomplete="off">
      <label for="code">קוד אישור</label>
      <input id="code" name="code" type="password" inputmode="text" autocomplete="off" required>
      <button id="go" type="submit">הפק חשבונית</button>
      <p id="formmsg" class="msg err" hidden></p>
    </form>
  </div>
  <section id="result" class="card" hidden></section>
</main>
<script>
const token = new URLSearchParams(location.search).get("t") || "";
history.replaceState(null, "", location.pathname);
const $ = id => document.getElementById(id);
const money = n => Number(n).toLocaleString("he-IL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const text = (tag, value, cls) => { const el = document.createElement(tag); el.textContent = value; if (cls) el.className = cls; return el; };
async function call(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "אירעה תקלה. נסו שוב.");
  return data;
}
function render(p) {
  $("banner").hidden = !p.dry_run;
  if (p.companies) {
    $("companies").hidden = false;
    if (p.companies.error) { $("companyerr").textContent = p.companies.error; $("companyerr").hidden = false; }
    for (const co of p.companies.items || []) $("companylist").append(text("dt", co.key), text("dd", co.value));
  }
  const c = p.customer;
  for (const [k, v] of [["שם", c.name], ['ת"ז / ח"פ', c.idNumber], ["כתובת", c.address], ["עיר", c.city]]) {
    $("customer").append(text("dt", k), text("dd", v));
  }
  for (const l of p.lines) {
    const tr = document.createElement("tr");
    tr.append(text("td", l.description), text("td", l.quantity, "n"), text("td", money(l.unit_price), "n"), text("td", money(l.total), "n"));
    $("lines").append(tr);
  }
  $("totals").append(
    text("span", "סה\"כ לפני מע\"מ"), text("span", money(p.total_before_vat), "n"),
    text("span", `מע"מ ${p.vat_rate}%`), text("span", money(p.vat), "n"),
    text("span", "סה\"כ לתשלום", "sum"), text("span", money(p.total), "sum"));
  $("view").hidden = false;
}
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  $("go").disabled = true; $("formmsg").hidden = true;
  try {
    const r = await call("/api/invoice/approve", { token, code: $("code").value });
    $("view").hidden = true;
    const box = $("result");
    box.replaceChildren();
    if (r.dry_run) {
      box.append(text("div", r.title, "banner"), text("p", "המסמך שהיה נשלח ל-AccountBook:"), text("pre", r.document_json));
    } else {
      box.append(text("p", "החשבונית הופקה", "msg ok"), text("div", `חשבונית מס מספר ${r.doc_number}`, "big"), text("p", "המסמך נשלח אליכם ב-WhatsApp."));
    }
    box.hidden = false;
  } catch (err) {
    $("formmsg").textContent = err.message; $("formmsg").hidden = false; $("go").disabled = false;
  }
});
(async () => {
  try { render(await call("/api/invoice/open", { token })); }
  catch (err) { $("error").textContent = err.message; $("error").hidden = false; }
})();
</script>
</body>
</html>
